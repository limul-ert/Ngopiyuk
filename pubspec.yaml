name: ngopi_yuk
description: "Aplikasi Discovery Cafe Madiun - Tugas UTS Flutter"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  provider: ^6.1.2
  intl: ^0.19.0

  # Package untuk fitur Auto-Update dari GitHub
  http: ^1.1.0
  package_info_plus: ^8.0.0
  version: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/images/kopi.png
    - assets/images/mascot/
    - assets/images/cafe/
    - assets/images/promo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/kopi.png"
  min_sdk_android: 21